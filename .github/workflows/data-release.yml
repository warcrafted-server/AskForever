name: Publish data release

on:
  push:
    branches:
      - 'publicar-base/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate tag
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#publicar-base/}"
          if [[ ! "$tag" =~ ^data-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Invalid data release tag: $tag" >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify checksum
        run: cd base && sha256sum -c wow.sqlite.zip.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            base/wow.sqlite.zip base/wow.sqlite.zip.sha256 \
            --prerelease --latest=false --target main \
            --title "Datos $RELEASE_TAG" \
            --notes "Base de datos de AskForever ($RELEASE_TAG). La descarga la app automáticamente; no hace falta bajarla a mano." \
            --repo "$GITHUB_REPOSITORY"

      - name: Delete publishing branch
        run: git push origin --delete "$GITHUB_REF_NAME"
