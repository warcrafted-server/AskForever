name: Publish game data

# Publica la base de datos del juego como release «data-AAAA.MM.DD» cuando se sube a la rama
# «data». El companion la descarga y comprueba su SHA-256. No se marca como «latest» para que
# la versión mostrada del proyecto siga siendo la del programa.
on:
  push:
    branches: [data]
    paths:
      - DATA_VERSION
      - wow.sqlite.zip
      - wow.sqlite.zip.sha256
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read data version
        id: version
        run: |
          tag="$(tr -d '[:space:]' < DATA_VERSION)"
          if ! [[ "$tag" =~ ^data-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Invalid DATA_VERSION: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify checksum and archive
        run: |
          expected="$(cut -d' ' -f1 wow.sqlite.zip.sha256)"
          actual="$(sha256sum wow.sqlite.zip | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "Checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          names="$(unzip -Z1 wow.sqlite.zip)"
          if [ "$names" != "wow.sqlite" ]; then
            echo "The archive must contain only wow.sqlite, found: $names" >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: wow.sqlite.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" wow.sqlite.zip wow.sqlite.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Game data ${TAG#data-}" \
            --latest=false \
            --notes "Game database for the AskForever companion (downloaded automatically, SHA-256 checked). Base de datos del juego para el companion de AskForever (se descarga sola y se comprueba su SHA-256)."
