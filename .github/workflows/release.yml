name: Release

on:
  push:
    tags:
      - 'v*'
    # En dev solo se compila (artefactos de prueba en Actions), nunca se publica release.
    branches:
      - dev
    paths:
      - 'companion/**'
      - 'scripts/installer.iss'
      - 'scripts/build-release.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (optional; defaults to VERSION)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: companion/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./companion[dev]" pyinstaller

      - name: Run tests
        working-directory: companion
        run: python -m pytest -q

      - name: Resolve and check version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $fileVersion = (Get-Content 'VERSION' -Raw).Trim()
          $tocLine = Select-String -Path 'addon/AskForever/AskForever.toc' -Pattern '^## Version:\s*(.+)$'
          if (-not $tocLine) { throw 'No se pudo leer la version del .toc.' }
          $tocVersion = $tocLine.Matches[0].Groups[1].Value.Trim()
          $selected = $fileVersion
          $release = 'false'
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'tag') {
              $selected = ($env:GITHUB_REF_NAME -replace '^[vV]', '')
              $release = 'true'
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
              $selected = ($env:INPUT_VERSION.Trim() -replace '^[vV]', '')
          }
          if ($selected -ne $fileVersion) {
              throw "La version seleccionada ($selected) no coincide con VERSION ($fileVersion)."
          }
          if ($selected -ne $tocVersion) {
              throw "La version seleccionada ($selected) no coincide con el .toc ($tocVersion)."
          }
          "version=$selected" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: Generate icon
        run: python companion/packaging/make_ico.py

      - name: Build companion
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --distpath dist --workpath build companion/packaging/askforever.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller fallo.' }
          if (-not (Test-Path 'dist/AskForever/AskForeverApp.exe')) {
              throw 'No existe dist/AskForever/AskForeverApp.exe.'
          }
          # AskForeverApp.exe no tiene consola: PowerShell no espera a un programa de ventana,
          # así que se lanza con Start-Process -Wait y se comprueba su código de salida.
          $help = Start-Process -FilePath 'dist/AskForever/AskForeverApp.exe' -ArgumentList '--help' -Wait -PassThru -NoNewWindow
          if ($help.ExitCode -ne 0) { throw 'AskForeverApp.exe --help fallo.' }

      - name: Smoke test of the built program (Credential Manager)
        shell: pwsh
        env:
          AF_KEY: smoke-test-not-a-real-key
        run: |
          # El programa empaquetado debe poder guardar, leer y borrar la clave en el
          # Administrador de credenciales de Windows (falló en la primera beta de prueba).
          $exe = 'dist/AskForever/AskForeverApp.exe'
          $setKey = Start-Process -FilePath $exe -ArgumentList 'set-key', '--provider', 'groq' -Wait -PassThru -NoNewWindow
          if ($setKey.ExitCode -ne 0) { throw 'set-key fallo.' }
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'companion'
          python -c "from askforever import config; assert config.get_api_key('groq') == 'smoke-test-not-a-real-key'"
          if ($LASTEXITCODE -ne 0) { throw 'La clave no se guardo en el Administrador de credenciales.' }
          $uninstall = Start-Process -FilePath $exe -ArgumentList 'uninstall', '--yes' -Wait -PassThru -NoNewWindow
          if ($uninstall.ExitCode -ne 0) { throw 'uninstall fallo.' }
          python -c "from askforever import config; assert config.get_api_key('groq') is None"
          if ($LASTEXITCODE -ne 0) { throw 'uninstall no borro la clave del Administrador de credenciales.' }
          Write-Host 'Credential Manager OK'

      - name: Build installer
        shell: pwsh
        working-directory: scripts
        run: |
          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $iscc = if ($isccCommand) { $isccCommand.Source } else { $null }
          if (-not $iscc) {
              $candidate = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
              if (Test-Path $candidate) {
                  $iscc = $candidate
              } else {
                  choco install innosetup -y --no-progress
                  if ($LASTEXITCODE -ne 0) { throw 'No se pudo instalar Inno Setup.' }
                  $iscc = $candidate
              }
          }
          if (-not (Test-Path $iscc)) { throw 'No se encontro ISCC.exe.' }
          $workspace = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path (Join-Path $workspace 'release') | Out-Null
          $version = '${{ steps.version.outputs.version }}'
          $sourceDir = (Resolve-Path (Join-Path $workspace 'dist/AskForever')).Path
          & $iscc "/DAppVersion=$version" "/DSourceDir=$sourceDir" 'installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'ISCC fallo.' }
          if (-not (Test-Path (Join-Path $workspace "release/AskForever-Setup-$version.exe"))) {
              throw 'No se genero el instalador.'
          }

      - name: Build addon zip
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "release/AskForever-Setup-$version.exe"
          $zip = "release/AskForever-$version.zip"
          foreach ($artifact in @($installer, $zip)) {
              if (-not (Test-Path $artifact)) { throw "Falta $artifact." }
              $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
              $name = Split-Path $artifact -Leaf
              "$hash  $name" | Out-File -FilePath "$artifact.sha256" -Encoding ascii
              Write-Host "$hash  $name"
          }

      - name: Attest artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/AskForever-Setup-${{ steps.version.outputs.version }}.exe
            release/AskForever-${{ steps.version.outputs.version }}.zip

      - name: Upload artifacts
        if: steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AskForever-${{ steps.version.outputs.version }}
          path: |
            release/AskForever-Setup-${{ steps.version.outputs.version }}.exe
            release/AskForever-Setup-${{ steps.version.outputs.version }}.exe.sha256
            release/AskForever-${{ steps.version.outputs.version }}.zip
            release/AskForever-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Create release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "release/AskForever-Setup-$version.exe"
          $zip = "release/AskForever-$version.zip"
          gh release view "v$version" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
              throw "La release v$version ya existe."
          }
          $installerHash = (Get-Content "$installer.sha256" -Raw).Trim()
          $zipHash = (Get-Content "$zip.sha256" -Raw).Trim()
          $notes = @"
          ## AskForever $version

          Cambios: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          Seguridad y transparencia: https://github.com/${{ github.repository }}/blob/main/docs/SECURITY_TRANSPARENCY.md

          SHA-256:
          $installerHash
          $zipHash
          "@
          $ghArgs = @(
              'release', 'create', "v$version",
              $installer, "$installer.sha256",
              $zip, "$zip.sha256",
              '--title', "AskForever $version",
              '--notes', $notes,
              '--latest',
              '--repo', "${{ github.repository }}"
          )
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear la release.' }

      - name: Upload to CurseForge
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CF_API_KEY)) {
              Write-Host '::warning::Falta el secreto CF_API_KEY: no se sube a CurseForge.'
              exit 0
          }
          $version = '${{ steps.version.outputs.version }}'
          $zip = "release/AskForever-$version.zip"
          $toc = Get-Content 'addon/AskForever/AskForever.toc' -Raw
          $projectId = [regex]::Match($toc, '(?m)^## X-Curse-Project-ID:\s*(\d+)').Groups[1].Value
          $interface = [int][regex]::Match($toc, '(?m)^## Interface:\s*(\d+)').Groups[1].Value
          if (-not $projectId -or -not $interface) { throw 'Faltan X-Curse-Project-ID o Interface en el .toc.' }
          # 16001 -> 1.60.1 (mayor, menor, parche), el nombre que usa CurseForge.
          $gameVersion = '{0}.{1}.{2}' -f [math]::Floor($interface / 10000), [math]::Floor(($interface % 10000) / 100), ($interface % 100)
          $headers = @{ 'X-Api-Token' = $env:CF_API_KEY }
          $api = 'https://wow.curseforge.com/api'
          $types = Invoke-RestMethod -Uri "$api/game/version-types" -Headers $headers
          $foreverTypes = @($types | Where-Object { "$($_.slug) $($_.name)" -match 'forever' } | ForEach-Object { $_.id })
          $versions = Invoke-RestMethod -Uri "$api/game/versions" -Headers $headers
          $candidates = @($versions | Where-Object { $_.name -eq $gameVersion -and ($foreverTypes.Count -eq 0 -or $foreverTypes -contains $_.gameVersionTypeID) })
          if ($candidates.Count -ne 1) {
              $versions | Where-Object { $_.name -eq $gameVersion } | ForEach-Object { Write-Host "Candidata: id=$($_.id) tipo=$($_.gameVersionTypeID) nombre=$($_.name)" }
              $types | ForEach-Object { Write-Host "Tipo: id=$($_.id) slug=$($_.slug) nombre=$($_.name)" }
              throw "No se pudo elegir una unica version de juego $gameVersion para Forever ($($candidates.Count) candidatas)."
          }
          # Siempre «release»: en CurseForge las betas y alfas llegan a muy poca gente (decisión de Marc, 2026-11-18).
          $releaseType = 'release'
          $notesPath = "docs/curseforge/changelog-$version.md"
          if (Test-Path $notesPath) {
              $changelog = Get-Content $notesPath -Raw -Encoding utf8
          } else {
              $changelog = "See https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
          }
          $displayName = "AskForever $version"
          $beta = [regex]::Match($changelog, 'Beta \d+')
          if ($beta.Success) { $displayName += " ($($beta.Value))" }
          $metadata = @{
              changelog = $changelog
              changelogType = 'markdown'
              displayName = $displayName
              gameVersions = @($candidates[0].id)
              releaseType = $releaseType
          } | ConvertTo-Json -Depth 4 -Compress
          $result = Invoke-RestMethod -Method Post -Uri "$api/projects/$projectId/upload-file" -Headers $headers -Form @{ metadata = $metadata; file = Get-Item $zip }
          Write-Host "Subido a CurseForge: $displayName ($releaseType), archivo $($result.id)"
